# Contract for task 007. Revision 1, Amendment 1.
# Endpoints this task changes: GET /AstronautDuty (new, query parameter), GET /AstronautDuty/{name} (removed),
# POST /AstronautDuty (hardened). Person endpoints are unchanged from contract 006 revision 3.
# JSON is camelCase. Every property under `required` is always present; nullability is explicit; property order is
# not significant. `responseCode` always equals the HTTP status.
# BREAKING vs main (280fcd9):
#   - GET /AstronautDuty/{name} removed (routing 404, empty body). Use GET /AstronautDuty?name=.
#   - GET /AstronautDuty?name=: unknown name is 404; duty items have exactly six fields (no `person` member).
#   - POST /AstronautDuty: 201 (was 200) + Location; unknown person 404 (was 400 with a stack-trace page);
#     duplicate 409 (was 400), scoped to the person, date part only, title ignoring ASCII case; dutyStartDate
#     required and bounded; rank and dutyTitle follow NameRule and are trimmed; 415 non-JSON; 413 over 4096 bytes.
# AMENDMENT 1 (after implementation, merged at 81f13f0). Documentation of observed behaviour only; no status code,
# shape or field changes, nothing new for clients to build:
#   - responses.ValidationFailed: a whitespace-only GET `name` (spaces, tab, LF) gives ONLY the required message
#     (MVC binds a whitespace-only query value to null). Was: [required, NameRule]. Status 400 unchanged.
#   - GET: a repeated `name` parameter binds the FIRST value (documented; one person, never merged).
#   - Person resolution in both operations: exact-case match first, then lowest Id (only observable on a database
#     that predates the unique name index). Was: lowest Id.
#   - DutyDate: precise wording of offset handling (an explicit numeric offset is converted to server local time;
#     `Z` is not).
openapi: 3.0.3
info:
  title: Stargate ACTS API - task 007 contract
  version: "007-r1-a1"
  description: >
    No endpoint has authentication or authorisation (unchanged by this task). Names, ranks and titles never alter
    the SQL that runs: they travel only as parameters. The person an operation applies to is resolved exactly once
    per request (trimmed, exact, ASCII case-insensitive name match; if more than one stored name matches, which is
    possible only on a database that predates the unique name index, the exact-case match wins, then the lowest
    id) and only that person's id is used afterwards. GET /Person/{name} resolves a name the same way.
paths:
  /AstronautDuty:
    get:
      operationId: GetAstronautDutiesByName
      tags: [AstronautDuty]
      summary: Get one person and their duties by exact name (case-insensitive)
      description: >
        NEW (replaces GET /AstronautDuty/{name}). `name` is required, trimmed of ASCII whitespace, validated against
        NameRule, then matched exactly against the stored full name ignoring ASCII case (no contains, no wildcards;
        `%` and `_` are not allowed characters anyway). 200 returns the person and all of their duties ordered by
        dutyStartDate descending, then id descending. A person with no astronaut assignment returns 200 with an
        empty `astronautDuties` (rule 2). An unknown name is 404. Order of checks: 400, then 404. No paging, no
        other filters. Unknown query parameters are ignored. If `name` is repeated (`?name=a&name=b`) only the
        FIRST value is used (framework binding); the values are never combined, and exactly one person (or 404)
        results. Clients send `name` once.
      parameters:
        - name: name
          in: query
          required: true
          description: The person's full name, URL-encoded (e.g. Elena%20Vasquez, Aoife%20O%27Brien%20Jr.).
          schema: { $ref: "#/components/schemas/NameRule" }
      responses:
        "200":
          description: Found. `person` is non-null; `astronautDuties` may be empty. success true, message "Successful", responseCode 200.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetAstronautDutiesByNameResult" }
              examples:
                elena:
                  value:
                    person: { personId: 5, name: Elena Vasquez, currentRank: MAJ, currentDutyTitle: Commander, careerStartDate: "2012-01-09T00:00:00", careerEndDate: null }
                    astronautDuties:
                      - { id: 7, personId: 5, rank: MAJ, dutyTitle: Commander, dutyStartDate: "2019-01-01T00:00:00", dutyEndDate: null }
                      - { id: 6, personId: 5, rank: CPT, dutyTitle: Pilot, dutyStartDate: "2016-03-01T00:00:00", dutyEndDate: "2018-12-31T00:00:00" }
                      - { id: 5, personId: 5, rank: 2LT, dutyTitle: Flight Engineer, dutyStartDate: "2012-01-09T00:00:00", dutyEndDate: "2016-02-29T00:00:00" }
                    success: true
                    message: Successful
                    responseCode: 200
                noAssignment:
                  value:
                    person: { personId: 1, name: Mira Okafor, currentRank: "", currentDutyTitle: "", careerStartDate: null, careerEndDate: null }
                    astronautDuties: []
                    success: true
                    message: Successful
                    responseCode: 200
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          description: >
            No person has this name. Fixed body; the name is never echoed. Clients key on the status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetAstronautDutiesByNameResult" }
              example: { person: null, astronautDuties: [], success: false, message: Person not found, responseCode: 404 }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      operationId: CreateAstronautDuty
      tags: [AstronautDuty]
      summary: Add a duty to a person
      description: >
        CHANGED. Adds a duty for the person whose stored name equals `name` (trimmed, exact, ASCII case-insensitive;
        on a database that predates the unique name index, an exact-case match wins over a case-folded one, then the
        lowest id, the same person GET /AstronautDuty?name= and GET /Person/{name} return).
        `name`, `rank` and `dutyTitle` are trimmed of ASCII whitespace, validated against NameRule and (rank,
        dutyTitle) stored trimmed. `dutyStartDate` is required; only its date part is used. Order of checks: 415
        (content type) and 413 (size), then 400 (body, NameRule, DutyDate), then 404 (unknown person), then 409.
        Duplicate = same person AND same dutyTitle ignoring ASCII case AND same start date (date part); the same
        title and date for a different person is allowed. On success the duty-history behaviour is unchanged from
        before this task (rules 3-7 are task 009): the person's AstronautDetail is created (first duty, careerStartDate
        = start) or updated (currentRank, currentDutyTitle); a dutyTitle exactly `RETIRED` (case-sensitive) sets
        careerEndDate (start on a first duty, start minus 1 day otherwise); the person's latest duty by start date
        (ties: highest id) gets dutyEndDate = start minus 1 day; the new duty is open (dutyEndDate null). All writes
        are one atomic save. Not idempotent: repeating a successful request returns 409. No authentication.
      requestBody:
        required: true
        description: >
          JSON object, at most 4096 bytes. Content-Type must be application/json (a charset parameter is allowed).
          Unknown properties are ignored (an id or personId cannot be chosen).
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAstronautDutyRequest" }
            example: { name: "Aoife O'Brien Jr.", rank: CPT, dutyTitle: Mission Specialist, dutyStartDate: "2026-03-01" }
      responses:
        "201":
          description: >
            Created. `id` is the new duty's id (integer >= 1). Fixed values: success true, message "Successful",
            responseCode 201. The body has exactly the four properties of CreateAstronautDutyResult.
          headers:
            Location:
              required: true
              description: >
                Relative URL "/AstronautDuty?name=" followed by the person's STORED name (not the request's casing
                or padding) escaped with Uri.EscapeDataString (RFC 3986: space as %20, apostrophe as %27, period and
                hyphen unescaped). Example for the stored name "Aoife O'Brien Jr.":
                /AstronautDuty?name=Aoife%20O%27Brien%20Jr. A GET of it returns 200 with that person and the new duty.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAstronautDutyResult" }
              example: { id: 11, success: true, message: Successful, responseCode: 201 }
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          description: No person has this name. Nothing written. No Location.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAstronautDutyResult" }
              example: { id: null, success: false, message: Person not found, responseCode: 404 }
        "409":
          description: >
            Conflict. Nothing written by this request. No Location. `message` is exactly one of two fixed strings;
            clients key on the status only:
            "A duty with this title and start date already exists for this person" (the duplicate check), or
            "The person's duties were changed by another request" (a concurrent first duty for the same person won
            the race on the existing unique index IX_AstronautDetail_PersonId).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAstronautDutyResult" }
              example: { id: null, success: false, message: A duty with this title and start date already exists for this person, responseCode: 409 }
        "413":
          description: >
            Body larger than 4096 bytes (enforced by Kestrel; also for chunked bodies). Body unspecified (empty in
            Production); key on the status. Nothing written.
        "415":
          description: >
            Unsupported Content-Type; key on the status only. A non-JSON Content-Type gets an EMPTY body. No
            Content-Type at all (including no body) gets ProblemDetails. Nothing written.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "500": { $ref: "#/components/responses/ServerError" }

  /AstronautDuty/{name}:
    get:
      operationId: RemovedGetAstronautDutiesByRoute
      deprecated: true
      tags: [AstronautDuty]
      summary: REMOVED in task 007 (documentation only; not in the generated Swagger document)
      description: >
        No action matches this path any more. The framework answers 404 with an EMPTY body (no person data, no
        envelope). Use GET /AstronautDuty?name=.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "404": { description: Routing 404, empty body. }

components:
  schemas:
    NameRule:
      type: string
      minLength: 1
      maxLength: 100
      description: >
        Unchanged from contract 006 r3. After removing leading/trailing ASCII whitespace (tab, LF, VT, FF, CR,
        space), 1 to 100 characters, each one of A-Z a-z 0-9 space . ' - , with at least one letter or digit. No
        other character (including any non-ASCII character anywhere) is accepted. Used for name (query and body),
        rank and dutyTitle. Pattern applied to the trimmed value:
      pattern: "^(?=[ .'-]*[A-Za-z0-9])[A-Za-z0-9 .'-]+$"
    DutyDate:
      type: string
      description: >
        ISO 8601 as accepted by System.Text.Json for DateTime. Clients SHOULD send a date only, "YYYY-MM-DD". A
        date-time is accepted and its time part is discarded. A value with an explicit numeric UTC offset
        (including "+00:00") is first converted by the JSON reader to the server's local time, so the stored date
        can differ by one day depending on the server's time zone; a value ending in "Z" is not converted and keeps
        its written date. Pre-existing behaviour; date-only parsing is task 009. The bounds are checked on the
        date the server ends up with. The date part must be between 1900-01-01 and 2100-12-31 inclusive. JSON null
        or a missing property is 400 (required); an unparseable string is 400 (body-shape message).
      example: "2026-03-01"
    CreateAstronautDutyRequest:
      type: object
      required: [name, rank, dutyTitle, dutyStartDate]
      properties:
        name:
          allOf: [{ $ref: "#/components/schemas/NameRule" }]
          description: The person's full name; matched trimmed, exactly, ignoring ASCII case.
        rank:
          allOf: [{ $ref: "#/components/schemas/NameRule" }]
          description: Rank, e.g. CPT, MAJ, 2LT. Stored trimmed, otherwise as given.
        dutyTitle:
          allOf: [{ $ref: "#/components/schemas/NameRule" }]
          description: Duty title, e.g. Pilot, Mission Specialist, RETIRED. Stored trimmed, otherwise as given.
        dutyStartDate:
          $ref: "#/components/schemas/DutyDate"
    CreateAstronautDutyResult:
      type: object
      required: [id, success, message, responseCode]
      properties:
        id: { type: integer, minimum: 1, nullable: true, description: "New duty id on 201; null on 404 and 409." }
        success: { type: boolean, description: "true on 201, false otherwise." }
        message: { type: string, description: "\"Successful\" on 201; the fixed texts listed under 404/409 otherwise." }
        responseCode: { type: integer, enum: [201, 404, 409] }
      additionalProperties: false
    PersonAstronaut:
      type: object
      description: Unchanged (same as GET /Person items).
      required: [personId, name, currentRank, currentDutyTitle, careerStartDate, careerEndDate]
      properties:
        personId: { type: integer, minimum: 1 }
        name: { type: string, description: The stored name. }
        currentRank: { type: string, description: '"" when the person has no assignment.' }
        currentDutyTitle: { type: string, description: '"" when the person has no assignment.' }
        careerStartDate: { type: string, nullable: true, description: '"YYYY-MM-DDT00:00:00" (no offset); null when no assignment.' }
        careerEndDate: { type: string, nullable: true, description: '"YYYY-MM-DDT00:00:00" (no offset) or null.' }
    AstronautDutyItem:
      type: object
      description: >
        NEW item shape (exactly these six properties; the former `person` member is gone). Dates are
        "YYYY-MM-DDT00:00:00" with no offset.
      required: [id, personId, rank, dutyTitle, dutyStartDate, dutyEndDate]
      properties:
        id: { type: integer, minimum: 1 }
        personId: { type: integer, minimum: 1, description: Always equals person.personId of the enclosing result. }
        rank: { type: string }
        dutyTitle: { type: string }
        dutyStartDate: { type: string }
        dutyEndDate: { type: string, nullable: true, description: null for the open (current) duty. }
      additionalProperties: false
    GetAstronautDutiesByNameResult:
      type: object
      required: [person, astronautDuties, success, message, responseCode]
      properties:
        person:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PersonAstronaut" }]
          description: Non-null on 200; null on 404.
        astronautDuties:
          type: array
          items: { $ref: "#/components/schemas/AstronautDutyItem" }
          description: On 200 ordered by dutyStartDate descending, then id descending; possibly empty. Always [] on 404.
        success: { type: boolean }
        message: { type: string, description: '"Successful" on 200; "Person not found" on 404.' }
        responseCode: { type: integer, enum: [200, 404] }
      additionalProperties: false
    ValidationProblemDetails:
      type: object
      required: [type, title, status, errors, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, enum: [400] }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        traceId: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        traceId: { type: string }

  responses:
    ValidationFailed:
      description: >
        Invalid input from [ApiController] model validation, before any handler runs; nothing is read from or
        written to the data tables. `errors` keys are compared ignoring case and are not to be branched on by
        clients. No message contains the submitted value.
        GET query `name` (key "name"): missing (`/AstronautDuty`), present without a value (`?name`), empty
        (`?name=`) or whitespace-only (for example `?name=%20%20`, `?name=%09`, `?name=%0A`) -> exactly
        ["The name field is required."] (AMENDMENT 1: the query binder turns a whitespace-only value into null, so
        the NameRule message is NOT added; this differs from the body fields below); other invalid ->
        [NameRule message].
        POST body, for each of name, rank, dutyTitle (keys "Name"/"Rank"/"DutyTitle", any case): missing or null ->
        ["The <Name|Rank|DutyTitle> field is required."]; empty or whitespace-only string -> [required message,
        NameRule message] in that order; other invalid string -> [NameRule message].
        POST dutyStartDate (key "DutyStartDate", any case): missing or null -> ["The DutyStartDate field is
        required."]; date part outside 1900-01-01..2100-12-31 -> ["Use a date between 1900-01-01 and 2100-12-31."].
        NameRule message (exact): "Use only English letters (A-Z), digits, spaces, hyphens, apostrophes and
        periods, with at least one letter or digit (at most 100 characters)."
        Body-shape failures (empty body, non-object body, wrong JSON type for a member, unparseable date string,
        truncated JSON): one or more entries whose keys are framework paths ("$", "$.<member>", and "request" for
        the missing body object) with generic fixed messages such as "The input was not valid." and "The request
        field is required.". No message contains a .NET type or namespace name, the words Path, LineNumber or
        BytePosition, or "could not be converted".
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblemDetails" }
    ServerError:
      description: >
        Unexpected fault only. Production: EMPTY body. Development: the developer exception page (text). Never a
        JSON envelope carrying an exception message; never SQL text or a stack trace in Production.
